# Публикува site/ на GitHub Pages (adm.zdoi.eu) след успешни тестове.
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', 'worker/src/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # при грешка редовете с нея излизат като анотации (видими и без вход в GitHub)
      - name: Тестове
        run: |
          npm test > test.log 2>&1 || { cat test.log; grep -E "not ok|Error|rror:|expected|actual|AssertionError" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      # Cloudflare кешира js и css: версията на commit-а сменя адресите им
      - name: Версия на файловете
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s/?v=dev/?v=$V/g" site/*.html
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$V'#g" site/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      # GitHub понякога показва каченото само след няколко секунди – без изчакване deploy-pages не го намира
      - name: Изчакване на качения архив
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
